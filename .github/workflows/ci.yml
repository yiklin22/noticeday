name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no model dependencies)
        run: pip install -e '.[mcp]' pytest httpx
      - name: Fast tests
        run: pytest -q -m "not model"
