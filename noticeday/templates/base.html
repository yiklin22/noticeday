<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}noticeday{% endblock %}</title>
<style>
  :root { --ink:#1d2329; --muted:#5d6872; --line:#d9dee3; --paper:#fbfaf7; --card:#fff;
          --accent:#1f5fbf; --warn:#a4460f; --warn-bg:#fdf0e6; --ok:#2d6a3e; --ok-bg:#e8f3eb; --mark:#ffe58a; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
  header { border-bottom:1px solid var(--line); background:var(--card); }
  header .wrap { display:flex; align-items:baseline; gap:1.5rem; }
  header a.brand { font-weight:700; color:var(--ink); text-decoration:none; font-size:1.1rem; }
  header span { color:var(--muted); font-size:.9rem; }
  .wrap { max-width:1060px; margin:0 auto; padding:1rem 16px; }
  h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
  h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { text-align:left; padding:.55rem .7rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; }
  .num { font-variant-numeric: tabular-nums; white-space:nowrap; }
  .pill { display:inline-block; padding:.05rem .5rem; border-radius:99px; font-size:.8rem; font-weight:600; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .soon { color:var(--warn); font-weight:600; }
  .muted { color:var(--muted); }
  a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
  input, select, button, textarea { font:inherit; }
  input[type=text], input[type=date], input[type=number], textarea, select { padding:.3rem .45rem; border:1px solid var(--line); border-radius:4px; background:#fff; }
  input[type=number] { width:5.5rem; }
  button { padding:.4rem .9rem; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.plain { background:#fff; color:var(--accent); }
  button.danger { background:#fff; color:var(--warn); border-color:var(--warn); }
  blockquote { margin:.4rem 0 0; padding:.5rem .7rem; background:#f5f6f7; border-left:3px solid var(--line); font-size:.88rem; color:#333; }
  mark { background:var(--mark); padding:0 .1rem; }
  .verdict { font-size:1.25rem; font-weight:700; }
  .row { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
  @media (max-width: 700px) { .hide-sm { display:none; } th, td { padding:.45rem; } }
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">noticeday</a><span>Contract renewal deadlines, with the clause behind each date</span></div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
</body>
</html>
